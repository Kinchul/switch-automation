[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-automation"
version = "0.1.0"
description = "Nintendo Switch automation from a Raspberry Pi using Bluetooth control and video feedback."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "vkindschi" }
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Faster JPEG encoding for the MJPEG preview feed and frame snapshots.
fast-jpeg = ["simplejpeg>=1.7"]
# Bluetooth controller emulation. Installed from the vendored submodule.
# Note: PEP 508 forbids relative `file://` URIs, so install nxbt explicitly:
#   ./.venv/bin/pip install -e ./tools/nxbt
controller = []
# Convenience: everything pip can install. Note: picamera2 is NOT here — on
# Raspberry Pi OS install it via `sudo apt install -y python3-picamera2` so it
# binds to the system libcamera stack. The local-display sink writes directly
# to /dev/fbN so it has no extra pip dependencies.
pi = [
  "switch-automation[fast-jpeg]",
  "switch-automation[controller]",
]

[project.scripts]
switch-automation = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli", "config"]

[tool.setuptools.packages.find]
where = ["src"]
